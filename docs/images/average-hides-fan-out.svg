<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">The average hides the fan-out</title>
<desc id="d">In demo PR 2, joining inverters duplicated 1,133 site-days and rows went from 2,441 to 4,056. Average energy per row moved from 33.75 to 33.46 kWh, minus 0.9 percent, which looks fine. Total energy moved from 82,394 to 135,709 kWh, plus 64.7 percent.</desc>
<defs>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</defs>
<rect width="1200" height="560" rx="24" fill="#0d0d0f"/>
<rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#2a2924" stroke-width="2"/>

<text x="54" y="62" class="mono" font-size="15" fill="#c8a96e" letter-spacing="3">TELHADO · DEMO PR #2</text>
<text x="54" y="108" class="sans" font-size="34" font-weight="700" fill="#f0ece4">The average hides the fan-out</text>
<text x="54" y="144" class="sans" font-size="18" fill="#9a958a">Joining inverters duplicated 1,133 site-days. Rows went from 2,441 to 4,056.</text>

<g transform="translate(54 196)">
  <rect width="520" height="276" rx="16" fill="#151517" stroke="#2a2924"/>
  <text x="28" y="44" class="sans" font-size="19" font-weight="600" fill="#f0ece4">Average energy per row</text>
  <text x="28" y="68" class="mono" font-size="13" fill="#9a958a">kWh · what a quick spot-check looks at</text>
  <text x="28" y="104" class="mono" font-size="13" fill="#9a958a">main</text>
  <rect x="28" y="112" width="380" height="30" rx="4" fill="#4a4740"/>
  <text x="420" y="133" class="mono" font-size="15" fill="#f0ece4">33.75</text>
  <text x="28" y="168" class="mono" font-size="13" fill="#9a958a">PR #2</text>
  <rect x="28" y="176" width="377" height="30" rx="4" fill="#7a9e7e"/>
  <text x="420" y="197" class="mono" font-size="15" fill="#f0ece4">33.46</text>
  <text x="28" y="250" class="sans" font-size="30" font-weight="700" fill="#7a9e7e">−0.9%</text>
  <text x="132" y="250" class="sans" font-size="17" fill="#9a958a">looks fine</text>
</g>

<g transform="translate(626 196)">
  <rect width="520" height="276" rx="16" fill="#151517" stroke="#2a2924"/>
  <text x="28" y="44" class="sans" font-size="19" font-weight="600" fill="#f0ece4">Total energy</text>
  <text x="28" y="68" class="mono" font-size="13" fill="#9a958a">kWh · what every dashboard sums</text>
  <text x="28" y="104" class="mono" font-size="13" fill="#9a958a">main</text>
  <rect x="28" y="112" width="211" height="30" rx="4" fill="#4a4740"/>
  <text x="251" y="133" class="mono" font-size="15" fill="#f0ece4">82,394</text>
  <text x="28" y="168" class="mono" font-size="13" fill="#9a958a">PR #2</text>
  <rect x="28" y="176" width="347" height="30" rx="4" fill="#c0614a"/>
  <text x="387" y="197" class="mono" font-size="15" fill="#f0ece4">135,709</text>
  <text x="28" y="250" class="sans" font-size="30" font-weight="700" fill="#c0614a">+64.7%</text>
  <text x="152" y="250" class="sans" font-size="17" fill="#9a958a">inflated by duplicate rows</text>
</g>

<text x="54" y="516" class="mono" font-size="14" fill="#9a958a">Same table, two summaries. dbt-pr-diff puts both in the PR comment, plus a duplicate-key count.</text>
</svg>
