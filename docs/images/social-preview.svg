<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<defs><style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style></defs>
<rect width="1280" height="640" fill="#0d0d0f"/>
<text x="80" y="118" class="mono" font-size="20" fill="#c8a96e" letter-spacing="4">GITHUB ACTION · DBT · DUCKDB</text>
<text x="80" y="200" class="sans" font-size="76" font-weight="800" fill="#f0ece4">dbt-pr-diff</text>
<text x="80" y="256" class="sans" font-size="30" fill="#9a958a">Post the numbers on every dbt pull request.</text>
<g transform="translate(80 316)">
  <rect width="1120" height="244" rx="18" fill="#151517" stroke="#2a2924" stroke-width="2"/>
  <text x="36" y="56" class="sans" font-size="28" font-weight="700" fill="#f0ece4"><tspan fill="#c0614a">✕</tspan>  2 checks failed</text>
  <g class="mono" font-size="20" fill="#9a958a">
    <text x="36" y="106">model</text><text x="330" y="106">rows</text>
    <text x="590" y="106">dup keys</text><text x="742" y="106">energy sum</text>
    <text x="922" y="106">energy avg</text>
  </g>
  <line x1="36" y1="122" x2="1084" y2="122" stroke="#2a2924" stroke-width="2"/>
  <text x="36" y="162" class="mono" font-size="22" fill="#f0ece4">fct_daily_generation</text>
  <text x="330" y="162" class="mono" font-size="22" fill="#f0ece4">2,441 → 4,056</text>
  <text x="590" y="162" class="mono" font-size="22" fill="#c0614a">1,133</text>
  <text x="742" y="162" class="mono" font-size="22" fill="#c0614a">+64.7%</text>
  <text x="922" y="162" class="mono" font-size="22" fill="#7a9e7e">−0.9%</text>
  <text x="36" y="212" class="sans" font-size="19" fill="#9a958a">Row counts · key changes · grain breaks · metric shifts, in one sticky comment.</text>
</g>
</svg>
